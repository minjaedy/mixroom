<svg xmlns="http://www.w3.org/2000/svg" width="880" height="590" viewBox="0 0 880 590"><rect width="880" height="590" rx="24" fill="#f3f0f8"/><g font-family="Segoe UI, Malgun Gothic, sans-serif"><text x="35" y="42" font-size="13" fill="#9b83b8">안내용 권한창 재현 · 실제 기기 캡처가 아니에요</text><text x="225" y="90" text-anchor="middle" font-size="17" font-weight="600" fill="#685477">iPhone</text><text x="655" y="90" text-anchor="middle" font-size="17" font-weight="600" fill="#685477">Android</text><rect x="45" y="115" width="360" height="400" rx="32" fill="#dcd7e4"/><rect x="475" y="115" width="360" height="400" rx="32" fill="#dcd7e4"/><rect x="70" y="210" width="310" height="195" rx="16" fill="#fbfaff"/><text x="225" y="250" text-anchor="middle" font-size="17" font-weight="600" fill="#3d3446">“MIXROOM”에서</text><text x="225" y="278" text-anchor="middle" font-size="17" font-weight="600" fill="#3d3446">알림을 보내고자 합니다</text><text x="225" y="311" text-anchor="middle" font-size="12" fill="#8e7a9d">새 수정본과 요청을 알려드려요.</text><path d="M70 349h310m-155 0v56" stroke="#e0d9e9"/><text x="147" y="383" text-anchor="middle" font-size="15" fill="#998ca7">허용 안 함</text><rect x="238" y="357" width="129" height="39" rx="8" fill="#eee4fb" stroke="#a279d2" stroke-width="2"/><text x="302" y="383" text-anchor="middle" font-size="15" font-weight="600" fill="#75539d">허용</text><rect x="500" y="210" width="310" height="195" rx="24" fill="#fbfaff"/><text x="655" y="250" text-anchor="middle" font-size="17" font-weight="600" fill="#3d3446">MIXROOM에서 알림을</text><text x="655" y="278" text-anchor="middle" font-size="17" font-weight="600" fill="#3d3446">보내도록 허용하시겠어요?</text><rect x="654" y="345" width="137" height="43" rx="20" fill="#eee4fb" stroke="#a279d2" stroke-width="2"/><text x="722" y="373" text-anchor="middle" font-size="15" font-weight="600" fill="#75539d">허용</text><text x="577" y="373" text-anchor="middle" font-size="15" fill="#998ca7">허용 안 함</text><path d="M302 450v-40m-12 15 12-15 12 15M722 450v-40m-12 15 12-15 12 15" fill="none" stroke="#a279d2" stroke-width="4" stroke-linecap="round"/><text x="440" y="558" text-anchor="middle" font-size="13" fill="#8f789e">앱에서 ‘알림 켜기’를 누른 다음, 권한창의 ‘허용’을 선택하세요.</text></g></svg>
